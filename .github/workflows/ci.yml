name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Colour first: it needs no build and fails in milliseconds, so a
      # contrast regression is reported before the slow step runs.
      - name: Contrast
        run: pnpm test:contrast

      - name: Layer boundaries
        run: pnpm test:layers

      # What `files` would install. Nothing in the build touches that
      # list, so a missing entry is invisible here and fatal in the
      # project that installs it.
      - name: Package surface
        run: pnpm test:package

      # The keyboard contracts. Nothing else here would notice if an
      # arrow key stopped moving or a mode stopped clearing.
      - name: Behaviour
        run: pnpm test:unit

      - name: Build
        run: pnpm build
