name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Colour first: it needs no build and fails in milliseconds, so a
      # contrast regression is reported before the slow step runs.
      - name: Contrast
        run: pnpm test:contrast

      - name: Layer boundaries
        run: pnpm test:layers

      # A closed dialog that an author's `display` un-hid is a
      # full-viewport blank block in the flow of every page that mounts
      # one. Invisible to the build, and to anyone who does not scroll to
      # the bottom of a page to check that nothing is there.
      - name: Closed dialogs
        run: pnpm test:dialogs

      # Both directions: a component with no page is one nobody can look
      # at, and nothing else in the build says so.
      - name: A page per component
        run: pnpm test:pages

      # What `files` would install. Nothing in the build touches that
      # list, so a missing entry is invisible here and fatal in the
      # project that installs it.
      - name: Package surface
        run: pnpm test:package

      # The keyboard contracts. Nothing else here would notice if an
      # arrow key stopped moving or a mode stopped clearing.
      - name: Behaviour
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # Last, because it needs the build's generated tsconfig. It catches
      # what neither the build nor the browser can: a template naming
      # something its script no longer declares, a prop that does not
      # exist, a hand-copied type that has drifted from the real one.
      # The demo run is the half of "the layer is consumable" that a
      # successful build does not cover.
      - name: Types
        run: pnpm test:types

      # Every page in a real browser, reading what it says. This is the
      # check that found a hydration mismatch on all fifty pages, a
      # full-viewport blank block on all fifty, and eight workshop
      # defects — none visible to anything above. Against the dev
      # server on purpose: a hydration mismatch is a dev-only warning.
      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Every page, in a browser
        run: pnpm test:e2e
